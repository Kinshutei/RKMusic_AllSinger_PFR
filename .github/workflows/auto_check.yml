name: Auto Check YouTube Stats

on:
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Pull latest changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || true
      
      - name: Run auto check script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNELS: ${{ secrets.CHANNELS }}
        run: python auto_check.py
      
      # 一部のチャンネルが失敗してスクリプトが異常終了しても、成功したチャンネルの分は保存する
      # （以前は保存の手順まで進まず、その日の全タレント分が失われる作りだった）
      - name: Commit and push changes
        if: success() || failure()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "Update YouTube stats [automated]"
          git pull --rebase origin main
          git push
